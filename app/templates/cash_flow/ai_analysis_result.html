<div class="bg-white rounded-xl shadow-md p-6 space-y-4">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h3 class="text-lg font-semibold text-gray-800">AI 收支分析</h3>
      <p class="text-xs text-gray-500">分析范围：{{ range_label }}</p>
    </div>
    <button
      type="button"
      class="text-sm text-blue-600 hover:underline"
      hx-get="/cash_flow/ai_analysis"
      hx-target="#ai-analysis-panel"
      hx-swap="innerHTML"
      hx-include="#start-month,#end-month"
      hx-indicator="#ai-loading"
    >
      重试
    </button>
  </div>

  {% if status == "ok" %}
  <div class="whitespace-pre-line text-sm text-gray-700">{{ analysis }}</div>
  {% else %}
  <p class="text-sm {{ 'text-red-600' if status in ['timeout', 'error'] else 'text-amber-600' }}">{{ message }}</p>
  {% if status == "timeout" %}
  <p class="text-xs text-gray-500">
    建议：检查网络后稍后重试；如长期超时，可在可访问 OpenAI 的网络环境运行，或配置合规代理。
  </p>
  {% endif %}
  {% endif %}
</div>
